name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure required files exist
        run: |
          test -f hugga-website-copy.md
          test -f index.html
          test -f .github/workflows/ci.yml
          test -f .github/workflows/deploy-pages.yml


      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate workflow YAML syntax
        run: |
          python - <<'PY'
          import pathlib
          import yaml

          workflows = sorted(pathlib.Path('.github/workflows').glob('*.yml'))
          for wf in workflows:
              with wf.open('r', encoding='utf-8') as f:
                  yaml.safe_load(f)
              print(f'Parsed {wf}')
          PY

      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@v1
