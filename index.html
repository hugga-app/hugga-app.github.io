<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hugga — Website Structure & Conversion Copy</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f4ef;
        --panel: #fffdf9;
        --text: #2b2b2b;
        --muted: #6d655d;
        --line: #e4ddd3;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }
      main {
        max-width: 860px;
        margin: 80px auto;
        padding: 0 24px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 32px;
      }
      h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.1; margin: 0 0 12px; }
      p { margin: 0 0 16px; }
      .muted { color: var(--muted); }
      .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
      .btn {
        display: inline-block;
        border: 1px solid var(--line);
        background: white;
        color: var(--text);
        text-decoration: none;
        border-radius: 10px;
        padding: 10px 14px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>Hugga copy deck</h1>
        <p class="muted">A complete website structure and conversion copy document for Hugga.</p>
        <p>
          This repository is deployed with GitHub Actions to GitHub Pages from the <strong>main</strong> branch.
          Open the full copy document below.
        </p>
        <div class="actions">
          <a class="btn" href="./hugga-website-copy.md">Open copy document</a>
        </div>
      </section>
    </main>
  </body>
</html>
